name: Create release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type'
        required: true
        type: choice
        default: 'patch-milestone'
        options:
          - 'patch-milestone'
          - 'minor-milestone'
          - 'patch'
          - 'minor'

defaults:
  run:
    shell: bash

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        run: exit 1
        if: |
          github.event.inputs.releaseType != 'minor' &&
          github.event.inputs.releaseType != 'patch' &&
          github.event.inputs.releaseType != 'minor-milestone' &&
          github.event.inputs.releaseType != 'patch-milestone'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GATLING_CI_TOKEN }} # for tag to trigger other workflows (release)

      - name: Next version
        id: tag
        uses: gatling/internal-actions@28228e1450d8999d09290e603d50ee506f8d5522 # version-bump/v1.0.1
        with:
          prefix: 'v'
          bump: ${{ github.event.inputs.releaseType }}

      - name: Git tag
        env:
          GIT_USER_NAME: ${{ vars.GATLING_CI_NAME }}
          GIT_USER_EMAIL: ${{ vars.GATLING_CI_EMAIL }}
          RELEASE_TYPE: ${{ github.event.inputs.releaseType }}
          TAG: ${{ steps.tag.outputs.next-tag }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          if [[ "$RELEASE_TYPE" == *-milestone ]]; then
            git tag "$TAG"
          else
            git tag "$TAG" -m "Version $TAG"
          fi
          git push origin "$TAG"
