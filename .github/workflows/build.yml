name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    timeout-minutes: 30
    env:
      JAVA_OPTS: "-Xmx6G"
      SBT_OPTS: "-Dsbt.ci=true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD_SBT_PLUGIN }}
          aws-region: us-east-1

      - name: Prepare environment
        env:
          PRIVATE_REPOSITORY_SBT: ${{ vars.PRIVATE_REPOSITORY_SBT_2 }}
        run: |
          mkdir --parents ~/.config/sbt/2 || true
          echo "$PRIVATE_REPOSITORY_SBT" > ~/.config/sbt/2/privateRepository.sbt

          # Scripted tests don't see the global configuration above, see SCRIPTED_SBT_GLOBAL in build.sbt
          scripted_global="$RUNNER_TEMP/scripted-sbt-global"
          mkdir --parents "$scripted_global/plugins"
          echo "$PRIVATE_REPOSITORY_SBT" > "$scripted_global/privateRepository.sbt"
          echo "$PRIVATE_REPOSITORY_SBT" > "$scripted_global/plugins/privateRepository.sbt"
          echo "SCRIPTED_SBT_GLOBAL=$scripted_global" >> "$GITHUB_ENV"

      - name: Test
        run: |
          sbt "+headerCheck; all scalafmtSbtCheck scalafmtCheckAll; scalafixAll --check; +testFull; +scripted"
